# Runs every check on each push and pull request: backend tests (including the C++ recorder and the
# trace integrity check), type check, unit tests, and the browser tests (including the arrow layout check).
# The npm and browser steps have not completed a run yet (they were skipped while the pytest step failed),
# so the first green pytest run may still surface small issues there.
name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      # System Python 3.12, not setup-python: setup-python puts its own libpython on LD_LIBRARY_PATH, and Ubuntu's gdb
      # then runs its embedded Python against a mixed install: every C++ trace died with "No module named 'math'".
      - run: sudo apt-get update && sudo apt-get install -y g++ gdb python3-venv
      - run: python3 -m venv .venv && .venv/bin/pip install -r backend/requirements.txt pytest
      - run: .venv/bin/python -m pytest -q test_trace.py backend/tests
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npx vitest run
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
